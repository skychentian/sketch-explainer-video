<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/timing.js"></script>
<script src="assets/cap_breaks.js"></script>
<style>
@font-face{font-family:"Hand";src:url(assets/fonts/hand-regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Hand";src:url(assets/fonts/hand-bold.woff2) format("woff2");font-weight:700}
:root{--paper:#f5f3ec;--dot:#d3cec1;--ink:#1f1f1f;--mute:#8a857a;--hl:#fbe07a;--red:#d0392b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:"Hand",sans-serif;color:var(--ink);background:var(--paper)}
#paper{position:absolute;inset:0;background:var(--paper) radial-gradient(circle,var(--dot) 3px,transparent 3.8px) 0 0/40px 40px}
.scene{position:absolute;inset:0}
.stage{position:absolute;inset:0;transform-origin:50% 40%}
.a{position:absolute;left:90px;right:90px}
.fx{display:flex;justify-content:center;align-items:center;gap:32px}
.col{display:flex;flex-direction:column;align-items:center;gap:26px}
.k{font-size:56px;color:var(--mute);text-align:center}
.h{font-size:112px;font-weight:700;text-align:center;line-height:1.3}
.t{font-size:68px;line-height:1.4}
.s{font-size:54px;line-height:1.4}
.c{text-align:center}
.ib{display:inline-block}
.red{color:var(--red)}
.mute{color:var(--mute)}
.hl{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-position:0 86%;background-size:100% 42%;padding:0 6px}
.box{display:inline-block;border:6px solid var(--ink);border-radius:26px 18px 30px 16px;padding:14px 36px;background:rgba(255,255,255,.35)}
.chap{display:inline-block;white-space:nowrap;font-size:58px;border:5px solid var(--ink);border-radius:60px;padding:4px 36px}
svg{overflow:visible;display:block}
svg .i{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
svg .r{fill:none;stroke:var(--red);stroke-linecap:round;stroke-linejoin:round}
svg text{font-family:"Hand"}
#cap{position:absolute;left:60px;right:60px;bottom:230px;height:90px}
.cl{position:absolute;inset:0;text-align:center;font-size:54px;line-height:90px;opacity:0;white-space:nowrap}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
<div id="paper" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="0"></div>
<!--SCENES-->
<div id="cap" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="2"></div>
<audio id="vo" src="assets/audio/narration.mp3" data-start="0" data-duration="__VOEND__" data-track-index="3"></audio>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const TX = window.VO_TEXT, TT = window.VO_T;
function T(p, from) {
  const i = TX.indexOf(p, from || 0);
  if (i < 0) throw new Error("phrase not found: " + p);
  for (let k = i; k < TX.length; k++) if (TT[k] != null) return TT[k];
}
document.fonts.ready.then(() => {
  document.querySelectorAll(".scene").forEach((sc) => {
    const s0 = +sc.dataset.start, dur = +sc.dataset.duration;
    const from = sc.dataset.from ? TX.indexOf(sc.dataset.from) : 0;
    const at = (v) => {
      if (!v) return s0 + 0.15;
      if (v[0] === "@") return s0 + parseFloat(v.slice(1));
      const [p, o] = v.split("|");
      return T(p, from) + (o ? parseFloat(o) : 0);
    };
    tl.fromTo(sc.querySelector(".stage"), { scale: 1 }, { scale: 1.035, duration: dur, ease: "none" }, s0);
    sc.querySelectorAll("svg").forEach((svg) => {
      const k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
      svg.querySelectorAll(".i").forEach((p) => (p.style.strokeWidth = 6 / k));
      svg.querySelectorAll(".r").forEach((p) => (p.style.strokeWidth = 7.5 / k));
    });
    sc.querySelectorAll("[data-w]").forEach((el) => {
      const n = el.textContent.trim().length;
      tl.fromTo(el, { clipPath: "inset(-30% 104% -30% -4%)" }, { clipPath: "inset(-30% -4% -30% -4%)", duration: Math.min(1.6, Math.max(0.35, n * 0.07)), ease: "power1.inOut" }, at(el.dataset.w));
    });
    sc.querySelectorAll("[data-f]").forEach((el) => {
      tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, at(el.dataset.f));
    });
    sc.querySelectorAll("[data-p]").forEach((el) => {
      tl.fromTo(el, { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, at(el.dataset.p));
    });
    sc.querySelectorAll("[data-h]").forEach((el) => {
      tl.fromTo(el, { backgroundSize: "0% 42%" }, { backgroundSize: "100% 42%", duration: 0.55, ease: "power2.out" }, at(el.dataset.h));
    });
    sc.querySelectorAll("[data-dim]").forEach((el) => {
      tl.to(el, { opacity: 0.4, duration: 0.4 }, at(el.dataset.dim));
    });
    sc.querySelectorAll("[data-d]").forEach((svg) => {
      const t0 = at(svg.dataset.d), per = parseFloat(svg.dataset.dur || "0.7");
      svg.querySelectorAll("path,rect,circle,ellipse,line").forEach((p, j) => {
        const len = p.getTotalLength();
        const tj = t0 + j * per * 0.55;
        tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 }, { strokeDashoffset: 0, duration: per, ease: "power1.inOut" }, tj);
        tl.set(p, { opacity: 1 }, tj);
      });
      svg.querySelectorAll("text").forEach((t, j) => tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t0 + 0.4 + j * 0.3));
    });
  });
  buildCaptions();
  window.__timelines["main"] = tl;
});
function buildCaptions() {
  const cap = document.getElementById("cap"), chunks = [];
  const BREAKS = window.CAP_BREAKS || [];
  const re = /[^，。？！、\n]+[，。？！、]?/g; let m;
  while ((m = re.exec(TX))) {
    const raw = m[0], i = m.index;
    if (!raw.trim()) continue;
    const cuts = [0];
    for (const b of BREAKS) { const j = raw.indexOf(b); if (j > 0) cuts.push(j); }
    cuts.sort((x, y) => x - y); cuts.push(raw.length);
    const pieces = cuts.slice(0, -1).map((c, n) => raw.slice(c, cuts[n + 1]));
    let off = 0;
    for (const p of pieces) { chunks.push({ i: i + off, s: p }); off += p.length; }
  }
  const merged = [];
  for (const c of chunks) {
    const last = merged[merged.length - 1];
    if (last && last.s.length + c.s.length <= 14 && /[，、]$/.test(last.s)) last.s += c.s;
    else merged.push({ ...c });
  }
  const tAt = (i) => { for (let k = i; k < TX.length; k++) if (TT[k] != null) return TT[k]; return window.VO_END; };
  merged.forEach((c, n) => {
    const t0 = tAt(c.i) - 0.05;
    const next = merged[n + 1];
    const t1 = next ? tAt(next.i) - 0.05 : window.VO_END;
    const el = document.createElement("div");
    el.className = "cl"; el.id = "caption-line-" + n;
    el.textContent = c.s.replace(/[，。、]$/, "").trim();
    const vw = [...el.textContent].reduce((a, ch) => a + (ch.charCodeAt(0) < 128 ? 0.55 : 1), 0);
    if (vw * 54 > 950) el.style.fontSize = Math.floor(950 / vw) + "px"; // 超长字幕自动缩小，保证不出框
    cap.appendChild(el);
    tl.set(el, { opacity: 1 }, Math.max(0, t0));
    tl.set(el, { opacity: 0 }, t1);
  });
}
</script>
</body>
</html>
